services:
  minio:
    image: minio/minio
    container_name: omr-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - omr_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/omr.db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      MINIO_BUCKET: omr-sheets
    ports:
      - "8000:8000"
    volumes:
      - omr_database:/data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      OMR_BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  qa:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
    environment:
      PLAYWRIGHT_APP_URL: http://frontend:5173
      PLAYWRIGHT_API_URL: http://backend:8000/api/v1
      PLAYWRIGHT_FIXTURES_DIR: /fixtures
      PLAYWRIGHT_REPORT_DIR: /reports
    volumes:
      - ./backend/tests/fixtures/sheets:/fixtures:ro
      - ./backend/generated/qa:/reports
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  omr_minio_data:
  omr_database:
