services:
  minio:
    image: minio/minio
    container_name: omr-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - omr_minio_data:/data

volumes:
  omr_minio_data:
